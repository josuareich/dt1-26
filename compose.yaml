services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: dt1_api:latest
    env_file:
      - .env

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    image: dt1_frontend:latest
    ports:
      - "0.0.0.0:8501:8501"
    depends_on:
      - api
    environment:
      BASE_URL: http://api:5001
